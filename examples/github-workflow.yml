# Copy to .github/workflows/x402-doctor.yml in your API repo.
# Fails the deploy check if your paid endpoints would reject real payments.
# Note: x402-doctor 0.1.0 is not on npm yet. Until it is, use Option B (the composite action),
# which builds from this repository.
name: x402-doctor
on:
  deployment_status:
  schedule:
    - cron: "0 */6 * * *" # also catch drift (e.g. someone changes the network env var)
  workflow_dispatch:

# The probe only makes outbound HTTP requests; it needs no repository access.
permissions:
  contents: read

jobs:
  doctor:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Option A: the npm package (after the first npm release)
      - run: npx -y x402-doctor https://api.example.com/paid/weather https://api.example.com/paid/search --min-score 90
      # Option B: the composite action from this repo
      # - uses: agnij-dutta/x402-doctor@v0
      #   with:
      #     urls: https://api.example.com/paid/weather
      #     min-score: "90"
      # JSON for dashboards / PR comments:
      - run: npx -y x402-doctor https://api.example.com/paid/weather --json > x402-doctor.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: x402-doctor
          path: x402-doctor.json
