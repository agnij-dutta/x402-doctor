name: x402-doctor
description: Probe x402 paid endpoints without paying and fail the job if payments would not settle.
author: Agnij Dutta
branding:
  icon: activity
  color: green
inputs:
  urls:
    description: Space-separated endpoint URLs to check.
    required: true
  method:
    description: HTTP method for the unpaid probe.
    default: GET
  min-score:
    description: Minimum score (0-100). Empty means fail on any failed check.
    default: ""
  facilitator:
    description: Facilitator base URL to check /supported against (optional).
    default: ""
  strict:
    description: Treat warnings as failures.
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --silent && npm run build --silent
    # Inputs are passed through env, never interpolated into the script, so a URL can't inject shell.
    - shell: bash
      env:
        X402D_URLS: ${{ inputs.urls }}
        X402D_METHOD: ${{ inputs.method }}
        X402D_MIN_SCORE: ${{ inputs.min-score }}
        X402D_FACILITATOR: ${{ inputs.facilitator }}
        X402D_STRICT: ${{ inputs.strict }}
        X402D_CLI: ${{ github.action_path }}/dist/cli.js
      run: |
        read -r -a urls <<< "$X402D_URLS"
        args=(--method "$X402D_METHOD")
        if [ -n "$X402D_MIN_SCORE" ]; then args+=(--min-score "$X402D_MIN_SCORE"); fi
        if [ -n "$X402D_FACILITATOR" ]; then args+=(--facilitator "$X402D_FACILITATOR"); fi
        if [ "$X402D_STRICT" = "true" ]; then args+=(--strict); fi
        node "$X402D_CLI" "${urls[@]}" "${args[@]}"
